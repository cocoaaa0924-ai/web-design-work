<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tisser Flowershop</title>
    <link rel="stylesheet" href="./css/style.css">

    <!-- ファビコン -->
    <link rel="shortcut icon" href="./img/fav2.jpg" type="image/x-icon">
    <link rel="apple-touch-icon" href="./img/fav2.jpg">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=BIZ+UDMincho&family=Montserrat:wght@100&family=Sawarabi+Mincho&family=Zen+Old+Mincho&display=swap"
        rel="stylesheet">

         <!-- マウス -->
    <div id="cursor" class="cursor"></div>

</head>

<body>
    <div class="wrap">
        <!-- <Left  nav> -->
        <header class="sidenav">
            <h1 class="logo"><img src="./img/logo2.gif" alt="logo"></h1>
            <nav class="nav">
                <div class="nav_menu">
                    <p class="about_nav text-anime"><a href="./index.html">ABOUT</a></p>
                    <p class="menu_nav text-anime"><a href="./menu.html">MENU</a></p>
                    <p class="event_nav text-anime"><a href="./event.html">EVENT</a></p>
                    <p class="contact_nav text-anime"><a href="./contact.html">CONTACT</a></p>
                </div>
            </nav>
            <button class="hamberger">
                <span></span>
                <span></span>
            </button>
        </header>

        <!-- main column -->
        <main>
            <div class="container">
                <!-- Hero -->
                <section class="hero">
                    <img src="./img/IMG_2712.JPG" alt="トップ">
                </section>

                <section class="menu">
                    <h2 class="midasi">MENU</h2>
                    <div class="menu_category">
                        <h3>BOUQUET</h3>
                        <div class="menu-items">
                            <img src="./img/IMG_2720.JPG" alt="花束1">
                            <img src="./img/IMG_2721.JPG" alt="花束2">
                            <img src="./img/IMG_2722.JPG" alt="花束3">
                            <img src="./img/IMG_2723.JPG" alt="花束4">
                        </div>
                        <p class="price">PRICE+TAX <br>
                            SS ¥3,000~ S ¥4,000~ M ¥5,000~ L ¥10,000~</p>
                    </div>

                    <div class="menu_category">
                        <h3>ARRANGEMENT</h3>
                        <div class="menu-items">
                            <img src="./img/IMG_2727.JPG" alt="花1">
                            <img src="./img/IMG_2728.JPG" alt="花2">
                            <img src="./img/IMG_2731.JPG" alt="花3">
                        </div>
                        <p class="price">price +tax <br>
                            ¥3,000~ ご予算に合わせてご対応いたします。</p>
                    </div>
                </section>
                <!-- Circle nav -->
                <section>
                    <div class="circle">
                        <a class="about_circle gazou-anime" href="./index.html"><img src="./img/about.png"
                                alt="aboutの丸い画像"></a>
                        <a class="event_circle gazou-anime" href="./event.html"><img src="./img/workshop_img.gif"
                                alt="eventの丸い画像"></a>
                        <a class="contact_circle gazou-anime" href="./contact.html"><img src="./img/contact_img.gif"
                                alt="contactの丸い画像"></a>
                    </div>
                </section>
            </div>

            <!-- Right insta -->
            <div class="insta">
                <a href="https://www.instagram.com/tmg.fleur___/" target="_blank" rel="noopener"><img
                        src="./img/insta.jpg" alt="インスタのロゴ"></a>

            </div>
        </main>
    </div>

    <!-- footer -->
    <footer>
        <div class="address">
            <img src="./img/logo2.gif" alt="logo">
            <br>〒553-0003 <br>
            大阪市福島区福島8丁目6-13 マイライフ福島101
            <br> tel 080-6985-0348
        </div>
    </footer>

    <script src="./script.js"></script>
</body>

</html>
